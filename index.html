<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13171D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CRM Clienti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonna unica mobile-first con barra in basso e pulsante "+" flottante; da 900px barra laterale a sinistra e schede a due colonne. */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F0F2F6; --ink:#0F172A; --muted:#64748B; --line:#E6E9F0;
  --accent:#0F172A; --on-accent:#FFFFFF;
  --ok:#1A7550; --ok-bg:#E1F2E9;
  --warn:#8F5500; --warn-bg:#FAEDD3;
  --new:#4F46E5; --new-bg:#EEF0FF;
  --danger:#B8302A; --danger-bg:#FBE6E3; --on-danger:#FFFFFF;
  --shadow:0 10px 28px rgba(19,23,29,.18);
  --side-bg:#0F172A; --side-ink:#AAB4C3; --side-hi:#FFFFFF; --side-act:rgba(255,255,255,.09); --side-line:rgba(255,255,255,.09); --brand:#818CF8;
  --c2:#4F46E5;--c1:#14B8A6;--c0:#CBD5E1; --av-s:42%; --av-bl:91%; --av-fl:27%; --sh-sm:0 1px 2px rgba(16,24,40,.05); --head-bg:rgba(247,248,250,.86);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E14; --surface:#12161F; --surface-2:#1A1F2B; --ink:#E8ECF4; --muted:#8B95A7; --line:#222937;
    --accent:#E8ECF4; --on-accent:#0B0E14; --c2:#5EEAD4; --c1:#F5B544; --c0:#5B6577;
    --ok:#5CCB98; --ok-bg:#12291F; --warn:#F5B544; --warn-bg:#2B2210; --new:#5EEAD4; --new-bg:#0F2A2A;
    --danger:#FF7E72; --danger-bg:#3A1A17; --on-danger:#1A0B09;
    --shadow:0 10px 28px rgba(0,0,0,.55); color-scheme:dark;
    --side-bg:#070A0F; --side-ink:#8B95A7; --brand:#5EEAD4; --side-act:rgba(255,255,255,.07); --av-s:30%; --av-bl:22%; --av-fl:82%; --sh-sm:none; --head-bg:rgba(11,14,20,.86);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E14; --surface:#12161F; --surface-2:#1A1F2B; --ink:#E8ECF4; --muted:#8B95A7; --line:#222937;
  --accent:#E8ECF4; --on-accent:#0B0E14; --c2:#5EEAD4; --c1:#F5B544; --c0:#5B6577;
  --ok:#5CCB98; --ok-bg:#12291F; --warn:#F5B544; --warn-bg:#2B2210; --new:#5EEAD4; --new-bg:#0F2A2A;
  --danger:#FF7E72; --danger-bg:#3A1A17; --on-danger:#1A0B09;
  --shadow:0 10px 28px rgba(0,0,0,.55); color-scheme:dark;
  --side-bg:#070A0F; --side-ink:#8B95A7; --brand:#5EEAD4; --side-act:rgba(255,255,255,.07); --av-s:30%; --av-bl:22%; --av-fl:82%; --sh-sm:none; --head-bg:rgba(11,14,20,.86);
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}

.shell{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.top .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:38px;height:38px;border-radius:10px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:780px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{position:relative;display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:2px;background:var(--ink);border-radius:0 0 2px 2px}
.badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--on-danger);font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(16px,calc((100vw - 780px)/2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow);z-index:30}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cnt{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.sheet .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible;padding-bottom:4px}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:44px !important}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:60px}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:block;text-align:left}
.t{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.done{text-decoration:line-through;color:var(--muted);font-weight:500}
.s{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s.snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.due.over{color:var(--danger);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.bell{display:inline-flex;align-items:center;gap:3px;vertical-align:-2px}
.ico{width:36px;height:36px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.check{position:relative;width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-accent)}
.check::before{content:"";position:absolute;inset:-10px}
.check.on{background:var(--accent);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.cliente{color:var(--ok);background:var(--ok-bg)}
.pill.approcciato{color:var(--warn);background:var(--warn-bg)}
.pill.da_approcciare{color:var(--new);background:var(--new-bg)}
.letter{padding:14px 4px 6px;font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:14px}
.grp{margin-bottom:22px}
.grp-h{font-size:15px;font-weight:600;margin:0 4px 8px;display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.grp-h.over{color:var(--danger)}
.grp-h.today{color:var(--warn)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px}
.sec-h h3{font-size:16px}
.link-btn{font-weight:600;font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:8px 22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;text-align:left}
.stat b{font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:600}
.stat.cliente span{color:var(--ok)} .stat.approcciato span{color:var(--warn)} .stat.da_approcciare span{color:var(--new)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:12px 6px}
.qa-i{display:grid;justify-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none;text-align:center}
.qa-i.off{opacity:.45;pointer-events:none}
.kv{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv-i{color:var(--muted);flex:none;display:grid}
.kv-b{flex:1;min-width:0;display:grid}
.kv-l{font-size:12.5px;color:var(--muted)}
.kv-v{overflow-wrap:anywhere}
.kv-v a{text-underline-offset:3px}
.ref{margin-bottom:10px}
.ref-h{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 14px}
.ref-h .grow{flex:1;min-width:0}
.note-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.two{display:block}

.empty{padding:22px 4px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px;font-weight:500}
.banner button{font-weight:700;text-decoration:underline;text-underline-offset:3px;flex:none}

.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.danger{border:1px solid var(--line);color:var(--danger);background:var(--surface)}
.btn.danger.armed{background:var(--danger);color:var(--on-danger);border-color:transparent}
.btn.wide{width:100%}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:calc(100% - 16px);overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:90%;padding-bottom:22px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sheet h2{font-size:21px;margin:4px 0 14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input:not([type="radio"]):not([type="checkbox"]):not([type="hidden"]),.field select,.field textarea,.search input{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.field textarea{resize:vertical;min-height:96px}
.row3{display:grid;grid-template-columns:90px 1fr 70px;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.static{min-height:48px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:600}
.err{color:var(--danger);font-size:14px;margin:-6px 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.actions .btn{flex:1 1 120px}
.stack{display:grid;gap:10px;margin-block:12px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;margin-bottom:8px}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.fu{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:14px}
.fu .field{margin-bottom:10px}
.pk-res{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pk-i{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-weight:600;text-align:left}
.pk-i:first-child{border-top:0}
.pk-i small{color:var(--muted);font-weight:400}
.pk-none{padding:12px 14px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.q{display:grid;gap:10px;justify-items:start;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-weight:600;min-height:96px;align-content:space-between}
.sum{display:grid;gap:6px;margin-block:8px 16px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--surface-2);border-radius:12px}
.sum b{font-variant-numeric:tabular-nums}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg.wrap{display:flex;flex-wrap:wrap}
.seg.wrap>label{flex:1 1 30%}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.seg label>span,.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:4px 8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;width:100%}
.seg input:checked+span,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.seg input:focus-visible+span{outline:2px solid var(--ink)}
.seg button[aria-pressed="true"].cliente{color:var(--ok)}
.seg button[aria-pressed="true"].approcciato{color:var(--warn)}
.seg button[aria-pressed="true"].da_approcciare{color:var(--new)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:70;max-width:calc(100% - 32px);text-align:center}
.loading{padding:40px 4px;color:var(--muted)}

/* ---- planning ---- */
.nav button[data-v="plan"]{display:none}
@media (min-width:720px){.nav button[data-v="plan"]{display:grid}}
@media (min-width:900px){.nav button[data-v="plan"]{display:flex}}
.plan-on .shell{max-width:none}
.plan-on #view{max-width:none}
.plan-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:4px}
.plan-nav{display:flex;gap:8px;padding-bottom:12px}
.plan-nav .chip{padding:0 12px}
.plan-range{font:600 15px var(--font-display);padding-bottom:12px;color:var(--muted)}
.chip-sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
.plan-sum{font-size:13px;color:var(--muted);margin:0 2px 8px}
.plan-scroll{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);max-height:calc(100vh - 250px)}
.plan{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.plan th,.plan td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;font-weight:400}
.plan tr>*:last-child{border-right:0}
.plan tbody tr:last-child>*{border-bottom:0}
.plan thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);height:56px;font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.plan thead th.c-name,.plan thead th.c-ref{text-align:left;padding:0 12px}
.plan .c-name{position:sticky;left:0;z-index:2;width:210px;min-width:210px;max-width:210px;background:var(--surface)}
.plan thead .c-name{z-index:4;background:var(--surface-2)}
.plan .c-ref{position:sticky;left:210px;z-index:2;width:150px;min-width:150px;max-width:150px;background:var(--surface);padding:6px 12px;box-shadow:2px 0 0 var(--line)}
.plan thead .c-ref{z-index:4;background:var(--surface-2)}
.plan .c-name button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-weight:600;font-size:14px}
.plan .c-name button:hover{background:var(--surface-2)}
.plan .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.plan .c-name .t{flex:1;min-width:0}
.plan .c-ref .s{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:9px;height:9px;border-radius:50%}
.dot.cliente{background:var(--ok)}.dot.approcciato{background:var(--warn)}.dot.da_approcciare{background:var(--new)}
.plan .c-day{min-width:52px;width:52px}
.plan .c-day span{display:block;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.plan .c-day b{display:block;font:700 16px var(--font-display);color:var(--ink);line-height:1.15}
.plan .c-day small{display:block;font-size:10.5px}
.plan thead .c-day.we{background:var(--bg)}
.plan .c-day.today{background:var(--accent);color:var(--on-accent)}
.plan .c-day.today b{color:var(--on-accent)}
.plan td.today{background:var(--surface-2)}
.pc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px;width:100%;height:100%;min-height:50px;padding:4px}
.pc:hover{background:var(--surface-2)}
.pc:empty::after{content:"+";color:var(--line);font-size:18px;opacity:0}
.pc:empty:hover::after,.pc:empty:focus-visible::after{opacity:1;color:var(--muted)}
.pi{position:relative;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%}
.pi i{position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;border-radius:7px;background:var(--ink);color:var(--bg);font:700 9.5px/14px var(--font-body);font-style:normal;text-align:center;padding:0 3px}
.pi.new{background:var(--new-bg);color:var(--new)}
.pi.ok{background:var(--ok-bg);color:var(--ok)}
.pi.warn{background:var(--warn-bg);color:var(--warn)}
.pi.mut{background:var(--surface-2);color:var(--muted)}
.pi.todo{background:none;color:var(--muted);border:1.5px dashed var(--line)}
.plan-leg{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;margin-top:12px}
.plan-leg>span{display:inline-flex;align-items:center;gap:6px}
.q.wide{grid-column:1/-1;min-height:84px}
.q small{font-weight:400;color:var(--muted);font-size:13px}
/* ---- statistiche, mappa, nota vocale ---- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-block:4px 6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi b{font:700 30px/1.1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- collegamento a Supabase ---------- */
function tname(k){return 'crm_'+k;}
var DBA={collection:function(k){return {doc:function(id){return {
  set:async function(o){
    var r=await sb.from(tname(k)).upsert({user_id:USER.id,id:id,data:o,updated_at:new Date().toISOString()},{onConflict:'user_id,id'});
    if(r.error)throw r.error;
  },
  delete:async function(){
    var r=await sb.from(tname(k)).delete().eq('id',id);
    if(r.error)throw r.error;
  }
};}};}};
async function fetchAll(k){
  var out=[],from=0,step=1000;
  for(;;){
    var r=await sb.from(tname(k)).select('id,data').order('id').range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data.map(function(x){return Object.assign({id:x.id},x.data);}));
    if(r.data.length<step)break;
    from+=step;
  }
  return out;
}
async function reloadAll(){
  try{for(var i=0;i<COLL.length;i++){S[COLL[i]]=await fetchAll(COLL[i]);}render();}catch(e){console.error(e);}
}
function applyChange(k,p){
  if(p.eventType==='DELETE'){var id=p.old&&p.old.id;if(id)S[k]=S[k].filter(function(x){return x.id!==id;});}
  else if(p.new){upsertState(k,Object.assign({id:p.new.id},p.new.data));}
  render();
}
function subscribeRealtime(){
  if(CHANNEL)return;
  CHANNEL=sb.channel('crm-'+USER.id);
  COLL.forEach(function(k){CHANNEL.on('postgres_changes',{event:'*',schema:'public',table:tname(k)},function(p){applyChange(k,p);});});
  CHANNEL.subscribe();
}
async function startSession(user){
  if(USER&&USER.id===user.id&&S.mode==='db')return;
  USER=user;DB=DBA;S.mode='loading';render();
  try{
    for(var i=0;i<COLL.length;i++){S[COLL[i]]=await fetchAll(COLL[i]);S.ready[COLL[i]]=true;}
    try{S.vendite=await fetchAll('vendite');S.vOk=true;}catch(e){S.vendite=[];S.vOk=false;}
    S.mode='db';subscribeRealtime();CFG.loaded=false;
  }catch(e){console.error(e);S.mode='error';S.errMsg=(e&&e.message)||'';}
  render();
}
function endSession(){
  if(CHANNEL&&sb){try{sb.removeChannel(CHANNEL);}catch(e){}}
  CHANNEL=null;USER=null;DB=null;
  COLL.forEach(function(k){S[k]=[];S.ready[k]=false;});S.vendite=[];S.vOk=false;CFG.loaded=false;CFG.email='';CFG.attiva=false;
  S.ui.tab='oggi';S.ui.clienteId=null;
  S.mode='auth';closeSheet();render();
}
function traduci(err){
  var m=(err&&err.message)||String(err||'');
  if(/Invalid login credentials/i.test(m))return 'Email o password non corrette.';
  if(/Email not confirmed/i.test(m))return 'Devi prima confermare l\'email: controlla la posta.';
  if(/already registered/i.test(m))return 'Esiste già un account con questa email. Prova ad accedere.';
  if(/at least \d+ characters/i.test(m))return 'La password è troppo corta (minimo 6 caratteri, meglio 8 o più).';
  if(/rate limit|too many/i.test(m))return 'Troppi tentativi ravvicinati. Aspetta un minuto e riprova.';
  if(/network|fetch/i.test(m))return 'Nessuna connessione. Riprova tra poco.';
  return m||'Operazione non riuscita.';
}

function filtered(){

function doRender(){

    return;
  }

  if(a&&a.id==='q'&&S.ui.tab==='clienti'&&!S.ui.clienteId){updateClientiList();renderNav();return;}
  renderHeader();renderNav();

  var ui=S.ui;
  if(ui.tab==='plan'&&!planWide()){ui.tab='oggi';renderHeader();renderNav();}

}

function wirePicker(sheet,onPick){
  var q=$('#pk-q',sheet),hid=$('#pk-id',sheet);
  if(!q){if(onPick)onPick(hid.value);return;}
  var res=$('#pk-res',sheet);
  function show(){
    var s=normKey(q.value),list=S.clienti.filter(function(c){return !s||normKey(c.nome).indexOf(s)>=0;}).sort(cmpNome).slice(0,6);
    res.innerHTML=list.map(function(c){return '<button type="button" class="pk-i" data-pick="'+esc(c.id)+'"><span>'+esc(c.nome)+'</span><small>'+esc(c.citta||'')+'</small></button>';}).join('')||'<div class="pk-none">Nessun risultato</div>';
    res.hidden=false;
  }
  q.addEventListener('input',function(){hid.value='';if(onPick)onPick('');show();});
  q.addEventListener('focus',show);
  res.addEventListener('click',function(e){
    var b=e.target.closest('[data-pick]');if(!b)return;
    var c=S.clienti.find(function(x){return x.id===b.dataset.pick;});if(!c)return;
    hid.value=c.id;q.value=c.nome;res.hidden=true;$('#pk-err',sheet).hidden=true;if(onPick)onPick(c.id);
  });
  sheet.addEventListener('click',function(e){if(!e.target.closest('#pk'))res.hidden=true;});
}

var BUCKET='crm-foto',MAXFOTO=10;
function fotoOk(){return !!(DB&&sb&&sb.storage);}
function removePhotos(paths){
  paths=(paths||[]).filter(Boolean);
  if(!paths.length||!fotoOk())return;
  try{sb.storage.from(BUCKET).remove(paths).then(function(r){if(r&&r.error)console.error(r.error);});}catch(e){console.error(e);}
}
async function resizeImg(file){
  var bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){URL.revokeObjectURL(u);res(im);};im.onerror=rej;im.src=u;});}
  var w=bmp.width||bmp.naturalWidth,hh=bmp.height||bmp.naturalHeight,k=Math.min(1,1600/Math.max(w,hh));
  var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(hh*k));
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('immagine'));},'image/jpeg',0.82);});
}
function fotoErr(e){
  var m=(e&&e.message)||String(e||'');
  if(/bucket/i.test(m)&&/not found/i.test(m))return 'lo spazio foto non è ancora attivo su Supabase (vedi la guida)';
  if(/row-level|policy|unauthor/i.test(m))return 'permessi mancanti su Supabase (vedi la guida)';
  return m||'errore sconosciuto';
}
function fmtAbs(iso){var p=String(iso).slice(0,10).split('-').map(Number),t=String(iso).slice(11,16);return p[2]+' '+MESI[p[1]-1]+' '+p[0]+(t&&t!=='00:00'?', '+t:'');}
function mailCorpo(d){
  var L=[d.tipo+(d.cliente?' · '+d.cliente:'')];
  L.push('');
  if(d.cliente)L.push('Cliente: '+d.cliente);
  L.push('Tipo: '+d.tipo);
  if(d.data)L.push('Data: '+d.data);
  if(d.ref)L.push('Con: '+d.ref);
  if(d.titolo)L.push('Oggetto: '+d.titolo);
  if(d.note){L.push('');L.push('Note:');L.push(d.note);}
  if(d.nfoto)L.push('','Foto allegate: '+d.nfoto);
  return L.join('\n');
}
async function shareVisita(d,files){
  var subject=d.tipo+(d.cliente?' – '+d.cliente:'')+(d.data?' – '+d.data:''),body=mailCorpo(Object.assign({},d,{nfoto:files.length}));
  function viaMail(){
    var b=body.length>1800?body.slice(0,1800)+'…':body;
    window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(b);
    if(files.length){
      files.forEach(function(f,i){setTimeout(function(){var a=document.createElement('a'),u=URL.createObjectURL(f);a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);},400+i*350);});
      toast('Allega alla mail le foto appena scaricate');
    }
  }
  if(files.length&&navigator.canShare&&navigator.canShare({files:files})){
    try{await navigator.share({title:subject,text:body,files:files});}
    catch(e){if(!e||e.name!=='AbortError'){console.error(e);viaMail();}}
    return;
  }
  viaMail();
}

function readSheet(ws,alias){
  var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),h=-1,map=null;
  for(var i=0;i<Math.min(5,aoa.length);i++){
    var m={},hits=0;
    aoa[i].forEach(function(cell,ci){var k=normKey(cell);if(!k)return;for(var f in alias){if(!(f in m)&&alias[f].indexOf(k)>=0){m[f]=ci;hits++;break;}}});
    if(hits>=2||(hits>=1&&i===0)){h=i;map=m;break;}
  }
  if(h<0)return [];
  var out=[];
  for(var r=h+1;r<aoa.length;r++){
    var o={},any=false;
    for(var f in map){var v=aoa[r][map[f]];o[f]=v;if(v!==''&&v!=null)any=true;}
    if(any)out.push(o);
  }
  return out;
}
function parseWorkbook(wb){
  var out={clienti:[],referenti:[],attivita:[],todo:[],ignorati:[]},one=wb.SheetNames.length===1;
  wb.SheetNames.forEach(function(name){
    var n=normKey(name),kind=null;
    if(/referent|contatt/.test(n))kind='referenti';
    else if(/attivit|report|visit/.test(n))kind='attivita';
    else if(/to do|todo|promemoria|azioni/.test(n))kind='todo';
    else if(/client|aziend|rubrica/.test(n))kind='clienti';
    else if(one)kind='clienti';
    if(!kind){out.ignorati.push(name);return;}
    out[kind]=out[kind].concat(readSheet(wb.Sheets[name],ALIAS[kind]));
  });
  return out;
}
function parseDT(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return {d:dstr(v),t:(v.getHours()||v.getMinutes())?pad(v.getHours())+':'+pad(v.getMinutes()):''};
  if(typeof v==='number'&&v>59&&window.XLSX){var o=XLSX.SSF.parse_date_code(v);if(o)return {d:o.y+'-'+pad(o.m)+'-'+pad(o.d),t:(o.H||o.M)?pad(o.H)+':'+pad(o.M):''};}
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))){
    var y=+m[3];if(y<100)y+=2000;if(+m[2]>12||+m[1]>31)return null;
    return {d:y+'-'+pad(+m[2])+'-'+pad(+m[1]),t:m[4]!=null?pad(+m[4])+':'+m[5]:''};
  }
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2}))?/))){
    if(+m[2]>12||+m[3]>31)return null;
    return {d:m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]),t:m[4]!=null?pad(+m[4])+':'+m[5]:''};
  }
  return null;
}

  }).join('')+'</tr>';

function mondayOf(s){var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return addDays(s,-((d.getDay()+6)%7));}
function shiftMonth(s,n){var p=s.split('-').map(Number),m=p[1]-1+n,last=new Date(p[0],m+1,0).getDate();return dstr(new Date(p[0],m,Math.min(p[2],last)));}
function localDay(iso){return iso?dstr(new Date(iso)):'';}
var PERIODI={
  sett:{label:'Settimana',prev:'sett. scorsa',unit:'sett'},
  mese:{label:'Mese',prev:'mese scorso',unit:'mese'},
  anno:{label:'Anno',prev:'anno scorso',unit:'mese'},
  sempre:{label:'Sempre',prev:'',unit:'mese'}
};
function periodRange(p){
  var t=todayStr(),y=t.slice(0,4);
  if(p==='sett'){var s=mondayOf(t);return {r:[s,t],pr:[addDays(s,-7),addDays(t,-7)]};}
  if(p==='mese'){var m=t.slice(0,8)+'01';return {r:[m,t],pr:[shiftMonth(m,-1),shiftMonth(t,-1)]};}
  if(p==='anno'){return {r:[y+'-01-01',t],pr:[shiftMonth(y+'-01-01',-12),shiftMonth(t,-12)]};}
  return {r:['0000-01-01',t],pr:null};
}
function inR(d,r){return !!d&&d>=r[0]&&d<=r[1];}
function statData(){
  var I=idx();
  function real(id){var c=I.cm.get(id);return !!c&&!c.esempio;}
  return {I:I,cl:S.clienti.filter(function(c){return !c.esempio;}),ac:S.attivita.filter(function(a){return real(a.clienteId);}),td:S.todo.filter(function(x){return real(x.clienteId);})};
}
function countIn(D,r){
  return {
    nuovi:D.cl.filter(function(c){return inR(localDay(c.creato),r);}).length,
    visite:D.ac.filter(function(a){return a.tipo==='visita'&&inR((a.data||'').slice(0,10),r);}).length,

function buckets(unit){

  else{var f=t.slice(0,8)+'01';for(i=11;i>=0;i--){var s2=shiftMonth(f,-i),e=addDays(shiftMonth(s2,1),-1);out.push({r:[s2,e],label:MESI[+s2.slice(5,7)-1]});}}
  return out;

function barChart(vals,labels,what){

function vCover(m){
  if(!m)return '';
  if(!m.per||!m.per.length)return 'Dati dal '+fmtIT(m.da)+' al '+fmtIT(m.a);
  var set={};
  m.per.forEach(function(p){var y=+p[0].slice(0,4),mo=+p[0].slice(5,7),y2=+p[1].slice(0,4),m2=+p[1].slice(5,7);while(y<y2||(y===y2&&mo<=m2)){(set[y]=set[y]||{})[mo]=1;mo++;if(mo>12){mo=1;y++;}}});
  return 'Mesi caricati · '+Object.keys(set).sort().map(function(y){var ms=Object.keys(set[y]).map(Number).sort(function(a,b){return a-b;}),out=[],st=ms[0],pv=ms[0];for(var i=1;i<=ms.length;i++){if(ms[i]!==pv+1){out.push(st===pv?MESI[st-1]:MESI[st-1]+'–'+MESI[pv-1]);st=ms[i];}pv=ms[i];}return y+': '+out.join(', ');}).join(' · ');

function vInP(d,p){

/* --- fatturato non abbinato --- */
function vUnmAgg(){

/* --- cancellare un caricamento --- */
async function vDelLoad(i){
  var m=anaMeta(),L=(m&&m.log)||[],e=L[i];if(!e)return;
  var docs=[],dels=[];
  S.vendite.forEach(function(d){
    if(!d.clienteId)return;
    var rr=d.righe||[],keep=rr.filter(function(r){return !(r[1]>=e.da&&r[1]<=e.a);});
    if(keep.length===rr.length)return;
    if(keep.length)docs.push({id:d.id,clienteId:d.clienteId,anno:d.anno,righe:keep});else dels.push(d.id);
  });
  var per=(m.per||[]).slice(),pi=-1;
  per.forEach(function(p,k){if(pi<0&&p[0]===e.da&&p[1]===e.a)pi=k;});if(pi>=0)per.splice(pi,1);
  var log=L.slice();log.splice(i,1);
  var da='',a='';per.forEach(function(p){if(!da||p[0]<da)da=p[0];if(!a||p[1]>a)a=p[1];});
  docs.push({id:'_meta',da:da,a:a,per:per,log:log,caricato:m.caricato||new Date().toISOString()});
  try{await putMany('vendite',docs);await delMany('vendite',dels);toast('Caricamento cancellato');vLog();}
  catch(err){console.error(err);toast('Cancellazione non riuscita. Riprova.');}
}

/* ---------- clienti a rischio, opportunità, preparazione visita ---------- */
function vEndYM(){var mt=anaMeta(),t=todayStr(),e=(mt&&mt.a)?(mt.a<t?mt.a:t):t;return e.slice(0,7);}
function ymN(ym){return +ym.slice(0,4)*12+ +ym.slice(5,7);}
function ymFromN(n){var y=Math.floor((n-1)/12),m=n-y*12;return y+'-'+('0'+m).slice(-2);}
function vRisk(){
  var out=[];if(!S.vOk||!S.vendite.length)return out;
  var end=vEndYM(),en=ymN(end),st=ymFromN(en-11),all=vAll(),I=idx(),td=todayStr();
  all.forEach(function(rows,cid){
    var c=I.cm.get(cid);if(!c)return;
    var r12=rows.filter(function(r){var m=r.d.slice(0,7);return m>=st&&m<=end;});
    if(!r12.length)return;
    var months={},tot=0,last='';
    r12.forEach(function(r){var m=r.d.slice(0,7);months[m]=1;tot+=r.t;if(m>last)last=m;});
    var active=Object.keys(months).length,since=en-ymN(last),interval=12/active;
    var lv='';(I.ta.get(cid)||[]).forEach(function(a){var d=(a.data||'').slice(0,10);if(a.tipo==='visita'&&d<=td&&d>lv)lv=d;});
    var item={c:c,tot:tot,last:last,since:since,lv:lv,active:active};
    if(active>=3&&since>=2&&since>=interval*1.5){item.kind='fermo';item.msg='Non ordina da '+since+' mesi (di solito ogni ~'+(interval<1.5?'mese':Math.round(interval)+' mesi')+')';item.score=1e9+tot;out.push(item);return;}
    var T=vToday(),cur=vSum(rows.filter(function(r){return vInP(r.d,'ytd');})),prv=vSum(rows.filter(function(r){return vInP(r.d,'prevytd');})),d=dlt(cur.t,prv.t);
    if(prv.t>=1500&&d!=null&&d<=-0.3){item.kind='calo';item.msg='Fatturato '+Math.round(d*100)+'% rispetto allo stesso periodo '+(T.Y-1);item.lost=prv.t-cur.t;item.score=prv.t-cur.t;out.push(item);}
  });
  return out.sort(function(a,b){return b.score-a.score;});
}
function riskRow(x){
  var tag=x.kind==='fermo'?'<span class="rk fermo">Fermo</span>':'<span class="rk calo">In calo</span>';
  return '<li class="row rrow"><button class="row-main" data-act="prep" data-id="'+esc(x.c.id)+'"><span class="t">'+esc(x.c.nome)+'</span><span class="s">'+esc(x.msg)+'</span><span class="s">'+(x.kind==='fermo'?'Ultimi 12 mesi: '+eur0(x.tot):'Perso finora: '+eur0(x.lost))+(x.lv?' · ultima visita '+fmtDay(x.lv):' · mai visitato')+'</span></button>'+tag+'<span class="chev">'+ic('chevron',18)+'</span></li>';
}
function panel(cls,title,count,link,body){return '<section class="panel '+cls+'"><div class="ph"><span class="pt">'+esc(title)+(count!=null?' <span class="cnt">'+count+'</span>':'')+'</span>'+(link||'')+'</div>'+body+'</section>';}
function riskCard(){

function riskSheet(){
  var L=vRisk();
  openSheet('Clienti a rischio','<p class="ghint">Clienti che comprano meno del solito: <b>fermi</b> (nessun ordine da più mesi del loro ritmo normale) o <b>in calo</b> (almeno −30% sullo stesso periodo dell\'anno scorso).</p>'+(L.length?'<ul class="list">'+L.map(riskRow).join('')+'</ul>':'<p class="ghint">Nessun cliente a rischio.</p>')+'<div class="actions"><button type="button" class="btn ghost" data-act="close">Chiudi</button></div>');
  var sh=$('.sheet');if(sh)sh.classList.add('wide');

function vOpp(cid){
  var end=vEndYM(),en=ymN(end),st=ymFromN(en-11),all=vAll(),mine=null,peers=[];
  all.forEach(function(rows,id){
    var cs={};rows.forEach(function(r){var m=r.d.slice(0,7);if(m<st||m>end||r.c==='Altro')return;cs[r.c]=(cs[r.c]||0)+r.t;});
    if(!Object.keys(cs).length)return;
    if(id===cid)mine=cs;else peers.push(cs);
  });
  if(!mine||peers.length<3)return [];
  var sim=peers.filter(function(p){return Object.keys(p).filter(function(k){return mine[k];}).length>=2;});
  if(sim.length<4)sim=peers;
  var cat={};
  sim.forEach(function(p){Object.keys(p).forEach(function(k){if(mine[k])return;var e=cat[k]||(cat[k]={n:0,t:0});e.n++;e.t+=p[k];});});
  return Object.keys(cat).map(function(k){return {cat:k,n:cat[k].n,of:sim.length,share:cat[k].n/sim.length,avg:cat[k].t/cat[k].n};}).filter(function(o){return o.n>=3&&o.share>=0.3;}).sort(function(a,b){return b.share-a.share;}).slice(0,4);
}

  // vendite
  if(rows.length){
    var cur=vSum(rows.filter(function(r){return vInP(r.d,'ytd');})),prv=vSum(rows.filter(function(r){return vInP(r.d,'prevytd');})),d=dlt(cur.t,prv.t);

    // prodotti
    function agg(keyf,labf){var m=new Map();rows.forEach(function(r){var inC=vInP(r.d,'ytd'),inP=vInP(r.d,'prevytd');if(!inC&&!inP)return;var k=keyf(r);if(!k)return;var e=m.get(k);if(!e){e={l:labf(r),cur:0,prv:0};m.set(k,e);}if(inC)e.cur+=r.t;else e.prv+=r.t;});return Array.from(m.values()).map(function(e){e.d=e.cur-e.prv;e.p=e.prv>0?e.d/e.prv:null;return e;});}

function loadLib(src,test){return new Promise(function(res,rej){if(test()){res();return;}var s=document.createElement('script');s.src=src;s.onload=function(){test()?res():rej(new Error('lib'));};s.onerror=function(){rej(new Error('rete'));};document.head.appendChild(s);});}
async function rptMakePdf(){
  var pg=document.querySelector('#rpt .rpt-pg');if(!pg)return;
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',function(){return !!window.html2canvas;});
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',function(){return !!(window.jspdf&&window.jspdf.jsPDF);});
  var W=760,off=document.createElement('div');off.className='rpt rpt-off';
  var cl=pg.cloneNode(true);cl.style.cssText='width:'+W+'px;max-width:'+W+'px;margin:0;padding:0;box-shadow:none;background:#fff';cl.classList.add('rpt-cl');
  off.appendChild(cl);document.body.appendChild(off);
  try{
    await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});
    var base=cl.getBoundingClientRect().top,H=cl.scrollHeight;
    var tops=Array.prototype.map.call(cl.querySelectorAll('section,.r-hd'),function(e){return Math.round(e.getBoundingClientRect().top-base);}).filter(function(t){return t>0;});
    var cv=await window.html2canvas(cl,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false,width:W,windowWidth:W});
    var k=cv.width/W,PH=1100,pages=[],y=0;
    while(y<H-2){
      var lim=y+PH;
      if(H<=lim){pages.push([y,H]);break;}
      var b=0;tops.forEach(function(t){if(t>y+120&&t<=lim&&t>b)b=t;});
      if(!b)b=lim;
      pages.push([y,b]);y=b;
    }
    var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    pages.forEach(function(p,i){
      var hh=Math.max(1,Math.round((p[1]-p[0])*k)),c2=document.createElement('canvas');c2.width=cv.width;c2.height=hh;
      var ctx=c2.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c2.width,hh);ctx.drawImage(cv,0,Math.round(p[0]*k),cv.width,hh,0,0,cv.width,hh);
      if(i)pdf.addPage();
      pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',10,10,190,190*hh/cv.width);
      pdf.setFontSize(8);pdf.setTextColor(120);pdf.text('Pagina '+(i+1)+' di '+pages.length,105,292,{align:'center'});
    });
    return pdf.output('blob');
  }finally{off.remove();}
}
async function rptPdf(el){

    var blob=await rptMakePdf();if(!blob)throw new Error('vuoto');
    if(RPT.url)URL.revokeObjectURL(RPT.url);
    var t=(document.querySelector('#rpt h1')||{}).textContent||'cliente';
    RPT.blob=blob;RPT.url=URL.createObjectURL(blob);RPT.name='Visita - '+t.replace(/[^\w\s.-]/g,'').trim()+' - '+todayStr()+'.pdf';
    var bar=document.querySelector('#rpt .rpt-act');
    if(bar)bar.innerHTML='<a class="btn ghost" href="'+RPT.url+'" download="'+esc(RPT.name)+'" target="_blank" rel="noopener">Apri / Scarica</a><button type="button" class="btn primary" data-act="rpt-share">Condividi PDF</button>';
    toast('PDF pronto');
  }catch(e){
    console.error(e);toast('Non riesco a creare il PDF: controlla la connessione');
    if(el){el.disabled=false;el.textContent='Crea PDF';}
  }
}
async function rptShare(){
  if(!RPT.blob)return;

  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:RPT.name});return;}
  }catch(e){if(e&&e.name==='AbortError')return;console.error(e);}

}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function ensureLeaflet(){
  if(window.L)return Promise.resolve();
  if(LEAFP)return LEAFP;
  LEAFP=new Promise(function(res,rej){
    var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);
    var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    s.onload=function(){res();};s.onerror=function(){LEAFP=null;rej(new Error('leaflet'));};document.head.appendChild(s);
  });
  return LEAFP;
}
function hasGeo(c){return typeof c.lat==='number'&&typeof c.lng==='number'&&c.geo===addr(c);}
function geoTodo(c){return !!addr(c)&&c.geo!==addr(c);}
function geoFailed(c){return !!addr(c)&&c.geo===addr(c)&&typeof c.lat!=='number';}
function mapToolsHtml(){
  var list=filtered(),on=list.filter(hasGeo).length,todo=S.clienti.filter(geoTodo).length,fail=S.clienti.filter(geoFailed).length;
  var h='<span class="grow"><b>'+on+'</b> di '+list.length+' clienti sulla mappa</span>';
  if(FIX)h+='<span class="grow"><b>Tocca la mappa</b> nel punto esatto</span><button class="btn ghost" data-act="geo-cancel">Annulla</button>';
  else if(GEO.run)h+='<span>Cerco gli indirizzi… '+GEO.done+'/'+GEO.total+'</span><button class="btn ghost" data-act="geo-stop">Ferma</button>';
  else{
    if(todo)h+='<button class="btn primary" data-act="geo-run">'+ic('pin',16)+' Localizza '+todo+(todo===1?' indirizzo':' indirizzi')+'</button>';
    if(fail)h+='<button class="btn ghost" data-act="geo-retry">'+fail+' non trovati · riprova</button>';
    var apx=S.clienti.filter(function(c){return hasGeo(c)&&isApprox(c);}).length;
    if(apx)h+='<button class="btn ghost" data-act="geo-approx">'+apx+' approssimati · riprova</button>';
  }
  if(!FIX)h+='<button class="btn ghost" data-act="geo-me">'+ic('locate',16)+' Vicino a me</button>';
  return h;
}
function updateMapTools(){var t=$('#map-tools');if(t)t.innerHTML=mapToolsHtml();}
function refreshMarkers(fit){
  if(!MAP||!window.L)return;
  MLAYER.clearLayers();
  var pts=[];
  filtered().filter(hasGeo).forEach(function(c){
    var col=STATO_COL[c.stato]||'#465789',ll=[c.lat,c.lng];
    var m=L.circleMarker(ll,{radius:10,color:'#FFFFFF',weight:2.5,fillColor:col,fillOpacity:isApprox(c)?.55:1});
    var a=addr(c);
    m.bindPopup('<div class="pop"><b>'+esc(c.nome)+'</b><small>'+esc([c.citta,STATI[c.stato]?STATI[c.stato].label:''].filter(Boolean).join(' · '))+(isApprox(c)?' · posizione approssimata (solo il comune)':c.geoLv==='strada'?' · posizione sulla via, senza civico':'')+'</small><div class="pb"><button data-act="open-cliente" data-id="'+esc(c.id)+'">Apri scheda</button><button data-act="geo-fix" data-id="'+esc(c.id)+'">Correggi</button><a href="https://www.google.com/maps/dir/?api=1&destination='+c.lat+','+c.lng+'" target="_blank" rel="noopener noreferrer">Indicazioni</a></div></div>',{minWidth:190});
    MLAYER.addLayer(m);pts.push(ll);
  });
  if(fit&&pts.length){MAP.fitBounds(L.latLngBounds(pts),{padding:[36,36],maxZoom:14});MAPFIT=true;}
}
function mkMap(){
  if(MAP)return;
  MAPEL=document.createElement('div');MAPEL.className='map';
  MAP=L.map(MAPEL).setView([42.5,12.5],6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
  MLAYER=L.layerGroup().addTo(MAP);
  MAP.on('click',function(ev){
    if(!FIX)return;
    var c=S.clienti.find(function(x){return x.id===FIX;});FIX=null;MAPEL.classList.remove('fixing');
    if(!c){updateMapTools();return;}
    var o=clone(c);o.lat=ev.latlng.lat;o.lng=ev.latlng.lng;o.geo=addr(c);o.geoApprox=false;o.geoLv='manuale';
    put('clienti',o).then(function(){toast('Posizione corretta');});updateMapTools();
  });
}
function geoFix(id){
  if(!MAP)return;FIX=id;MAP.closePopup();MAPEL.classList.add('fixing');updateMapTools();
}
function attachMap(){
  if(!$('#map-host'))return;
  ensureLeaflet().then(function(){
    var host=$('#map-host');if(!host)return;
    mkMap();FIX=null;MAPEL.classList.remove('fixing');
    host.appendChild(MAPEL);MAP.invalidateSize();refreshMarkers(!MAPFIT);
  }).catch(function(){var h=$('#map-host');if(h)h.innerHTML='<p class="map-msg">Non riesco a caricare la mappa. Controlla la connessione a internet e riprova.</p>';});
}
async function nomi(params){
  var r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&countrycodes=it&accept-language=it&'+params);
  if(!r.ok)throw new Error('http '+r.status);
  var j=await r.json();
  if(!(j&&j[0]))return null;
  var x=j[0],ad=x.address||{},t=x.addresstype||x.type||'',lv='citta';
  if(ad.house_number||/^(house|building|apartments|commercial|industrial|retail|office|yes)$/.test(x.type||''))lv='civico';
  else if(x.category==='highway'||/^(road|residential|industrial|pedestrian|service|tertiary|secondary|primary|unclassified|living_street)$/.test(t))lv='strada';
  return {lat:+x.lat,lng:+x.lon,lv:lv};
}
async function geocodeOne(q){var r=await nomi('q='+encodeURIComponent(q));return r?{lat:r.lat,lng:r.lng}:null;}
function cleanStreet(s){
  return String(s||'').replace(/\(([A-Za-z]{2})\)/g,' ').replace(/[–—]/g,',').replace(/\bital(y|ia)\b/gi,' ')
    .replace(/(^|[\s,])(s\.?\s?n\.?\s?c?\.?)(?=$|[\s,])/gi,' ').replace(/\bn\.?\s?(?=\d)/gi,'').replace(/\s*,\s*,+/g,',').replace(/\s{2,}/g,' ').replace(/^[\s,]+|[\s,]+$/g,'');
}
async function geocodeClient(c){
  var st=cleanStreet(c.indirizzo),city=(c.citta||'').trim(),cap=(c.cap||'').trim(),res=null;
  function enc(o){return Object.keys(o).filter(function(k){return o[k];}).map(function(k){return k+'='+encodeURIComponent(o[k]);}).join('&');}
  var steps=[];
  if(st){
    steps.push(function(){return nomi(enc({street:st,city:city,postalcode:cap,country:'Italia'}));});
    steps.push(function(){return nomi('q='+encodeURIComponent([st,cap,city,'Italia'].filter(Boolean).join(', ')));});
    if(cap&&city)steps.push(function(){return nomi(enc({street:st,city:city,country:'Italia'}));});
  }
  for(var i=0;i<steps.length;i++){
    if(i)await sleep(1100);
    res=await steps[i]();
    if(res&&res.lv!=='citta')return res;
  }
  if(city||cap){
    if(steps.length)await sleep(1100);
    var cr=await nomi('q='+encodeURIComponent([[cap,city].filter(Boolean).join(' '),c.prov,'Italia'].filter(Boolean).join(', ')));
    if(cr){cr.lv='citta';return cr;}
  }
  return res;
}
function isApprox(c){return !!(c.geoApprox||c.geoLv==='citta');}
async function geoRun(){
  if(GEO.run)return;
  var ids=S.clienti.filter(geoTodo).map(function(c){return c.id;});
  if(!ids.length)return;
  GEO={run:true,stop:false,done:0,total:ids.length};updateMapTools();
  var found=0,broke=false;
  for(var i=0;i<ids.length;i++){
    if(GEO.stop)break;
    var c=S.clienti.find(function(x){return x.id===ids[i];});
    if(!c||!geoTodo(c)){GEO.done++;continue;}
    var q=addr(c),res=null;
    try{res=await geocodeClient(c);}catch(e){console.error(e);toast('Ricerca interrotta: controlla la connessione');broke=true;break;}
    var o=clone(S.clienti.find(function(x){return x.id===ids[i];})||c);
    o.geo=q;
    if(res){o.lat=res.lat;o.lng=res.lng;o.geoLv=res.lv;o.geoApprox=res.lv==='citta';found++;}else{o.lat=null;o.lng=null;o.geoApprox=false;o.geoLv='';}
    await put('clienti',o);GEO.done++;updateMapTools();
    await sleep(1100);
  }
  GEO.run=false;updateMapTools();refreshMarkers(true);
  if(!broke)toast(found+' '+(found===1?'indirizzo localizzato':'indirizzi localizzati'));
}
async function geoRetry(all){
  var list=all?S.clienti.filter(function(c){return hasGeo(c)&&isApprox(c);}):S.clienti.filter(geoFailed);
  for(var i=0;i<list.length;i++){var o=clone(list[i]);o.geo='';await put('clienti',o);}
  geoRun();
}
function geoMe(){
  if(!MAP||!navigator.geolocation){toast('Posizione non disponibile');return;}
  navigator.geolocation.getCurrentPosition(function(p){
    var ll=[p.coords.latitude,p.coords.longitude];
    if(ME)MLAYER.removeLayer(ME);
    ME=L.circleMarker(ll,{radius:8,color:'#FFFFFF',weight:3,fillColor:'#2563EB',fillOpacity:1});MLAYER.addLayer(ME);
    MAP.setView(ll,12);
  },function(){toast('Non riesco a leggere la posizione. Consenti l\'accesso dal browser.');},{timeout:12000});
}

  });
  if(r.back)h+='<li class="gs base"><span class="gn">P</span><span class="gt"><b>Rientro alla base</b><small>'+esc(fmtKm(r.back.km)+' · '+fmtMin(r.back.min))+'</small></span></li>';

function gmapsUrls(r){
  var g=giroSt(),seq=[[g.base.lat,g.base.lng]].concat(r.stops.map(function(s){return [s.c.lat,s.c.lng];}));
  if(r.back)seq.push([g.base.lat,g.base.lng]);
  var urls=[],i=0,f=function(p){return p[0].toFixed(6)+','+p[1].toFixed(6);};
  while(i<seq.length-1){
    var j=Math.min(i+9,seq.length-1),u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+f(seq[i])+'&destination='+f(seq[j]);
    if(j-i>1)u+='&waypoints='+seq.slice(i+1,j).map(f).join('%7C');
    urls.push(u);i=j;
  }
  return urls;
}
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)*Math.sin(dg/2);return 2*R*Math.asin(Math.sqrt(x));}
function giroLocal(pts,ritorno){
  var n=pts.length,D=[],i,j;
  for(i=0;i<n;i++){D.push([]);for(j=0;j<n;j++)D[i].push(hav(pts[i],pts[j])*1.3);}
  var left=[],ord=[0];for(i=1;i<n;i++)left.push(i);
  while(left.length){var last=ord[ord.length-1],bi=0;for(i=1;i<left.length;i++)if(D[last][left[i]]<D[last][left[bi]])bi=i;ord.push(left.splice(bi,1)[0]);}
  function cost(o){var s=0;for(var k=0;k<o.length-1;k++)s+=D[o[k]][o[k+1]];if(ritorno)s+=D[o[o.length-1]][0];return s;}
  var imp=true,it=0;
  while(imp&&it++<60){imp=false;
    for(i=1;i<ord.length-1;i++)for(j=i+1;j<ord.length;j++){
      var c=ord.slice(0,i).concat(ord.slice(i,j+1).reverse(),ord.slice(j+1));
      if(cost(c)<cost(ord)-1e-9){ord=c;imp=true;}
    }
  }
  var legs=[];for(i=0;i<ord.length-1;i++)legs.push({km:D[ord[i]][ord[i+1]],min:D[ord[i]][ord[i+1]]/55*60});
  if(ritorno)legs.push({km:D[ord[ord.length-1]][0],min:D[ord[ord.length-1]][0]/55*60});
  return {order:ord,legs:legs,geom:ord.map(function(k){return pts[k];}).concat(ritorno?[pts[0]]:[]),src:'stima'};
}
async function giroOsrm(pts,ritorno){
  var co=pts.map(function(p){return p[1].toFixed(6)+','+p[0].toFixed(6);}).join(';');
  var url='https://router.project-osrm.org/trip/v1/driving/'+co+'?source=first&'+(ritorno?'roundtrip=true':'roundtrip=false&destination=any')+'&steps=false&overview=full&geometries=geojson';
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},20000);
  try{
    var r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error('http '+r.status);
    var j=await r.json();if(j.code!=='Ok'||!j.trips||!j.trips[0])throw new Error(j.code||'osrm');
    var ord=[];j.waypoints.forEach(function(w,i){ord[w.waypoint_index]=i;});
    var t0=j.trips[0];
    return {order:ord,legs:t0.legs.map(function(l){return {km:l.distance/1000,min:l.duration/60};}),geom:t0.geometry.coordinates.map(function(c){return [c[1],c[0]];}),src:'osrm'};
  }finally{clearTimeout(tm);}
}
async function giroCalc(){
  var g=giroSt();
  if(!g.base){toast('Imposta prima il punto di partenza');return;}
  var cl=g.sel.map(function(id){return S.clienti.find(function(c){return c.id===id;});}).filter(function(c){return c&&hasGeo(c);});
  if(!cl.length){toast('Scegli almeno un cliente');return;}
  if(cl.length>20){toast('Massimo 20 clienti per giro');return;}
  g.busy=true;g.err='';g.res=null;$('#g-res').innerHTML=giroResHtml();
  var pts=[[g.base.lat,g.base.lng]].concat(cl.map(function(c){return [c.lat,c.lng];})),out;
  try{out=await giroOsrm(pts,g.ritorno);}catch(e){console.error(e);out=giroLocal(pts,g.ritorno);}
  var stops=[];
  for(var i=1;i<out.order.length;i++)stops.push({c:cl[out.order[i]-1],km:out.legs[i-1].km,min:out.legs[i-1].min});
  var km=0,min=0;out.legs.forEach(function(l){km+=l.km;min+=l.min;});
  g.res={stops:stops,km:km,min:min,src:out.src,geom:out.geom,back:g.ritorno?out.legs[out.legs.length-1]:null};
  g.busy=false;
  var host=$('#g-res');if(host){host.innerHTML=giroResHtml();attachGiro();var s=$('#giro-map-host');if(s&&s.scrollIntoView)s.scrollIntoView({behavior:'smooth',block:'start'});}

var REC=null,RECLAST=null;
function recSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function recHtml(){
  if(!recSupported())return '<p class="hint" style="margin-top:-4px">La registrazione vocale non è disponibile su questo browser.</p>';
  return '<div class="rec"><button type="button" class="btn ghost" id="rec-btn" data-act="rec-toggle">'+ic('mic',18)+'<span>Nota vocale</span></button><span class="rec-st" id="rec-st" role="status">Parla e l\'AI scrive il resoconto</span></div><div class="rec-x" id="rec-x" hidden></div>';
}
function recUi(state,msg,bad){
  var b=$('#rec-btn'),s=$('#rec-st');if(!b)return;
  b.classList.toggle('on',state==='rec');b.disabled=(state==='work');
  b.querySelector('span').textContent=state==='rec'?'Ferma':state==='work'?'Elaboro…':'Nota vocale';
  b.firstChild.outerHTML=ic(state==='rec'?'stop':'mic',18);

async function recToggle(){
  if(REC&&REC.mr&&REC.mr.state==='recording'){REC.mr.stop();return;}
  var stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){recUi('idle','Microfono non disponibile: consenti l\'accesso dalle impostazioni del browser.',true);return;}
  var mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(function(m){return window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m);});
  var mr;try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(function(t){t.stop();});recUi('idle','Registrazione non supportata da questo browser.',true);return;}
  var r=REC={mr:mr,chunks:[],t0:Date.now(),discard:false,timer:0};
  mr.ondataavailable=function(e){if(e.data&&e.data.size)r.chunks.push(e.data);};
  mr.onstop=function(){
    clearInterval(r.timer);stream.getTracks().forEach(function(t){t.stop();});
    if(r.discard||!$('#rec-btn'))return;
    var blob=new Blob(r.chunks,{type:mr.mimeType||'audio/webm'});
    if(blob.size<2000){recUi('idle','Registrazione troppo breve.',true);return;}
    RECLAST=blob;recProcess(blob);
  };
  mr.start(1000);
  recUi('rec','0:00 · tocca Ferma quando hai finito');
  r.timer=setInterval(function(){
    var sec=Math.round((Date.now()-r.t0)/1000);
    if(!$('#rec-btn')){r.discard=true;if(mr.state==='recording')mr.stop();return;}
    recUi('rec',Math.floor(sec/60)+':'+pad(sec%60)+' · tocca Ferma quando hai finito');
    if(sec>=240&&mr.state==='recording')mr.stop();
  },500);
}
async function blobToWav(blob){
  var buf=await blob.arrayBuffer(),AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
  var audio=await new Promise(function(res,rej){ctx.decodeAudioData(buf,res,rej);});

  var rate=16000,len=Math.max(1,Math.ceil(audio.duration*rate)),OC=window.OfflineAudioContext||window.webkitOfflineAudioContext,off=new OC(1,len,rate);

  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(var i=0;i<n;i++){var x=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true);}

function blobToB64(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'');};fr.onerror=function(){rej(fr.error);};fr.readAsDataURL(b);});}
async function recProcess(blob){
  recUi('work','Trascrivo e riordino il testo…');
  var x=$('#rec-x');if(x)x.hidden=true;
  try{
    var b64=await blobToB64(await blobToWav(blob));
    var pk=$('#pk-id'),c=pk?S.clienti.find(function(k){return k.id===pk.value;}):null,tp=document.querySelector('input[name="tipo"]:checked');
    var r=await sb.functions.invoke('nota-vocale',{body:{audio:b64,mime:'audio/wav',cliente:c?c.nome:'',tipo:tp&&TIPI[tp.value]?TIPI[tp.value].label:''}});

      var msg='Servizio non raggiungibile. Riprova tra poco.',ctx=r.error.context;

    }

    var ta=$('#f-note');if(!ta)return;
    ta.value=(ta.value.trim()?ta.value.trim()+'\n\n':'')+d.testo.trim();
    var og=$('#f-titolo');if(og&&!og.value.trim()&&d.oggetto)og.value=String(d.oggetto).trim();
    RECLAST=null;RECTXT={testo:d.testo.trim(),raw:(d.trascrizione||'').trim()};

  }
}

var WASD=isDesk(),rzT=0;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){var d=isDesk();if(S.ui.tab==='plan'||d!==WASD){WASD=d;render();}},200);});
document.addEventListener('input',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='q'){S.ui.q=t.value;updateClientiList();}
  else if(t.id==='an-q'){S.ui.anaQ=t.value;var al=$('#an-list');if(al)al.innerHTML=anaCardsHtml(vCards());}
  else if(t.id==='g-q'){giroSt().q=t.value;var l=$('#g-list');if(l)l.innerHTML=giroListHtml();}
  else if(t.id==='g-base'){giroSt().baseTxt=t.value;}
  else if(t.id==='g-sosta'){var g=giroSt();g.sosta=Math.max(0,Math.min(240,+t.value||0));giroSave();var rs=$('#g-res');if(rs&&g.res){rs.innerHTML=giroResHtml();attachGiro();}}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='g-rit'){var g=giroSt();g.ritorno=e.target.checked;g.res=null;giroSave();var rs=$('#g-res');if(rs)rs.innerHTML=giroResHtml();}
});
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='auth-form'){e.preventDefault();doSignIn();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#scrim'))closeSheet();});
$('#file').addEventListener('change',function(e){handleFile(e.target.files&&e.target.files[0]);});
$('#file-v').addEventListener('change',function(e){var fs=Array.prototype.slice.call(e.target.files||[]);if(fs.length>1)handleVBatch(fs);else if(fs.length)handleVFile(fs[0]);});

init();
})();
