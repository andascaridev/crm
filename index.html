<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13171D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CRM Clienti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonna unica mobile-first con barra in basso e pulsante "+" flottante; da 900px barra laterale a sinistra e schede a due colonne. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#E9ECF0; --ink:#13171D; --muted:#5B6572; --line:#DEE2E8;
  --accent:#13171D; --on-accent:#FFFFFF;
  --ok:#1A7550; --ok-bg:#E1F2E9;
  --warn:#8F5500; --warn-bg:#FAEDD3;
  --new:#465789; --new-bg:#E5E9F4;
  --danger:#B8302A; --danger-bg:#FBE6E3; --on-danger:#FFFFFF;
  --shadow:0 10px 28px rgba(19,23,29,.18);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1115; --surface:#161A20; --surface-2:#1F242C; --ink:#EAEDF1; --muted:#9BA5B2; --line:#282E37;
    --accent:#EAEDF1; --on-accent:#0E1115;
    --ok:#5CCB98; --ok-bg:#12291F; --warn:#E8AE55; --warn-bg:#2B2210; --new:#93A8E4; --new-bg:#1A2138;
    --danger:#FF7E72; --danger-bg:#3A1A17; --on-danger:#1A0B09;
    --shadow:0 10px 28px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#161A20; --surface-2:#1F242C; --ink:#EAEDF1; --muted:#9BA5B2; --line:#282E37;
  --accent:#EAEDF1; --on-accent:#0E1115;
  --ok:#5CCB98; --ok-bg:#12291F; --warn:#E8AE55; --warn-bg:#2B2210; --new:#93A8E4; --new-bg:#1A2138;
  --danger:#FF7E72; --danger-bg:#3A1A17; --on-danger:#1A0B09;
  --shadow:0 10px 28px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}

.shell{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.top .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:38px;height:38px;border-radius:10px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{position:relative;display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:2px;background:var(--ink);border-radius:0 0 2px 2px}
.badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--on-danger);font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(16px,calc((100vw - 780px)/2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow);z-index:30}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cnt{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.sheet .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible;padding-bottom:4px}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:44px !important}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:60px}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:block;text-align:left}
.t{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.done{text-decoration:line-through;color:var(--muted);font-weight:500}
.s{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s.snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.due.over{color:var(--danger);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.bell{display:inline-flex;align-items:center;gap:3px;vertical-align:-2px}
.ico{width:36px;height:36px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.check{position:relative;width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-accent)}
.check::before{content:"";position:absolute;inset:-10px}
.check.on{background:var(--accent);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.cliente{color:var(--ok);background:var(--ok-bg)}
.pill.approcciato{color:var(--warn);background:var(--warn-bg)}
.pill.da_approcciare{color:var(--new);background:var(--new-bg)}
.letter{padding:14px 4px 6px;font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:14px}
.grp{margin-bottom:22px}
.grp-h{font-size:15px;font-weight:600;margin:0 4px 8px;display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.grp-h.over{color:var(--danger)}
.grp-h.today{color:var(--warn)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px}
.sec-h h3{font-size:16px}
.link-btn{font-weight:600;font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:8px 22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;text-align:left}
.stat b{font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:600}
.stat.cliente span{color:var(--ok)} .stat.approcciato span{color:var(--warn)} .stat.da_approcciare span{color:var(--new)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:12px 6px}
.qa-i{display:grid;justify-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none;text-align:center}
.qa-i.off{opacity:.45;pointer-events:none}
.kv{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv-i{color:var(--muted);flex:none;display:grid}
.kv-b{flex:1;min-width:0;display:grid}
.kv-l{font-size:12.5px;color:var(--muted)}
.kv-v{overflow-wrap:anywhere}
.kv-v a{text-underline-offset:3px}
.ref{margin-bottom:10px}
.ref-h{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 14px}
.ref-h .grow{flex:1;min-width:0}
.note-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.two{display:block}

.empty{padding:22px 4px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px;font-weight:500}
.banner button{font-weight:700;text-decoration:underline;text-underline-offset:3px;flex:none}

.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.danger{border:1px solid var(--line);color:var(--danger);background:var(--surface)}
.btn.danger.armed{background:var(--danger);color:var(--on-danger);border-color:transparent}
.btn.wide{width:100%}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:calc(100% - 16px);overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:90%;padding-bottom:22px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sheet h2{font-size:21px;margin:4px 0 14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input:not([type="radio"]):not([type="checkbox"]):not([type="hidden"]),.field select,.field textarea,.search input{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.field textarea{resize:vertical;min-height:96px}
.row3{display:grid;grid-template-columns:90px 1fr 70px;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.static{min-height:48px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:600}
.err{color:var(--danger);font-size:14px;margin:-6px 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.actions .btn{flex:1 1 120px}
.stack{display:grid;gap:10px;margin-block:12px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;margin-bottom:8px}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.fu{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:14px}
.fu .field{margin-bottom:10px}
.pk-res{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pk-i{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-weight:600;text-align:left}
.pk-i:first-child{border-top:0}
.pk-i small{color:var(--muted);font-weight:400}
.pk-none{padding:12px 14px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.q{display:grid;gap:10px;justify-items:start;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-weight:600;min-height:96px;align-content:space-between}
.sum{display:grid;gap:6px;margin-block:8px 16px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--surface-2);border-radius:12px}
.sum b{font-variant-numeric:tabular-nums}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg.wrap{display:flex;flex-wrap:wrap}
.seg.wrap>label{flex:1 1 30%}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.seg label>span,.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:4px 8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;width:100%}
.seg input:checked+span,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.seg input:focus-visible+span{outline:2px solid var(--ink)}
.seg button[aria-pressed="true"].cliente{color:var(--ok)}
.seg button[aria-pressed="true"].approcciato{color:var(--warn)}
.seg button[aria-pressed="true"].da_approcciare{color:var(--new)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:70;max-width:calc(100% - 32px);text-align:center}
.loading{padding:40px 4px;color:var(--muted)}

@media (min-width:900px){
  .nav{top:0;bottom:auto;right:auto;width:212px;height:100%;border-top:0;border-right:1px solid var(--line);padding:calc(28px + env(safe-area-inset-top,0px)) 12px 20px}
  .nav-in{max-width:none;display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px}
  .nav button[aria-current="page"]{background:var(--surface-2)}
  .nav button[aria-current="page"]::before{display:none}
  .badge{position:static;margin-left:auto}
  .shell{margin:0 0 0 212px;max-width:none;padding-inline:32px;padding-block:0 120px}
  .shell>*{max-width:1040px}
  .fab{right:32px;bottom:32px}
  .toast{bottom:32px}
  .chips{margin-inline:0;padding-inline:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .two .sec-h:first-child{margin-top:8px}
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}}
.noauth .nav,.noauth .fab,.noauth .top{display:none}
.noauth .shell{margin:0 auto;max-width:460px;padding-inline:20px}
.auth{padding-block:12vh 40px}
.auth h1{font-size:32px;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.auth .lead{color:var(--muted);margin-bottom:24px}
.auth .actions{margin-top:6px}
.auth .msg{margin-top:14px;font-size:14px;color:var(--muted);min-height:20px}
.auth .msg.bad{color:var(--danger)}
.auth .lnk{display:inline-block;margin-top:14px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Sezioni"><div class="nav-in" id="nav"></div></nav>
<button class="fab" id="fab" data-act="fab" aria-label="Aggiungi nuovo"></button>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>

function ic(n,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+ICON[n]+'"/></svg>';}

/* ---------- utilità ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(new Date());}
function addDays(s,n){var p=s.split('-').map(Number);return dstr(new Date(p[0],p[1]-1,p[2]+n));}
function diffDays(a,b){var pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pa[0],pa[1]-1,pa[2])-Date.UTC(pb[0],pb[1]-1,pb[2]))/864e5);}
function nowLocal(){var n=new Date();return dstr(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes());}
function normKey(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function cmpNome(a,b){return String(a.nome).localeCompare(String(b.nome),'it',{sensitivity:'base'});}
function fmtDay(s){
  if(!s) return '';
  var n=diffDays(s,todayStr());
  if(n===0) return 'Oggi'; if(n===1) return 'Domani'; if(n===-1) return 'Ieri';
  var p=s.split('-').map(Number);
  return GIORNI[new Date(p[0],p[1]-1,p[2]).getDay()]+' '+p[2]+' '+MESI[p[1]-1]+(p[0]!==new Date().getFullYear()?' '+p[0]:'');
}
function fmtDue(s){
  var n=diffDays(s,todayStr());
  if(n<0) return n===-1?'Scaduto ieri':'Scaduto da '+(-n)+' giorni';
  return fmtDay(s);
}
function fmtDT(iso){
  if(!iso) return '';
  var d=iso.slice(0,10),t=iso.slice(11,16);
  return fmtDay(d)+(t&&t!=='00:00'?' '+t:'');
}
function fmtIT(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtITDT(iso){if(!iso)return '';return fmtIT(iso.slice(0,10))+' '+iso.slice(11,16);}
function dateLong(){var d=new Date();return GIORNI_L[d.getDay()]+' '+d.getDate()+' '+MESI_L[d.getMonth()];}
function effDate(t){var a=t.scadenza||'',b=t.promemoria?t.promemoria.slice(0,10):'';if(a&&b)return a<b?a:b;return a||b||'';}
function byEff(a,b){return (effDate(a)||'9999').localeCompare(effDate(b)||'9999')||String(a.titolo).localeCompare(String(b.titolo),'it');}
function str(v){if(v==null)return '';if(v instanceof Date)return dstr(v);return String(v).trim();}
function addr(c){return [c.indirizzo,[c.cap,c.citta].filter(Boolean).join(' '),c.prov?'('+c.prov+')':''].filter(Boolean).join(', ');}

var S={clienti:[],attivita:[],todo:[],ready:{clienti:false,attivita:false,todo:false},mode:'loading',

function idx(){
  var cm=new Map(S.clienti.map(function(c){return [c.id,c];})),ta=new Map(),tt=new Map();
  S.attivita.forEach(function(a){if(!cm.has(a.clienteId))return;if(!ta.has(a.clienteId))ta.set(a.clienteId,[]);ta.get(a.clienteId).push(a);});

/* ---------- archivio ---------- */
function persistLocal(){try{localStorage.setItem('crm.v1',JSON.stringify({clienti:S.clienti,attivita:S.attivita,todo:S.todo}));}catch(e){}}
function loadLocal(){try{var j=JSON.parse(localStorage.getItem('crm.v1')||'null');if(j)COLL.forEach(function(k){S[k]=j[k]||[];});}catch(e){}}
function upsertState(coll,obj){var a=S[coll],i=a.findIndex(function(x){return x.id===obj.id;});if(i>=0)a[i]=obj;else a.push(obj);}
async function put(coll,obj){
  upsertState(coll,obj);
  if(!DB) persistLocal();
  render();
  if(DB){try{await DB.collection(coll).doc(obj.id).set(clone(obj));}catch(e){console.error(e);toast('Salvataggio non riuscito. Riprova.');}}
}
async function putMany(coll,list){
  if(!list.length)return;
  list.forEach(function(o){upsertState(coll,o);});
  if(!DB)persistLocal();
  render();
  if(DB){for(var i=0;i<list.length;i+=6){await Promise.all(list.slice(i,i+6).map(function(o){return DB.collection(coll).doc(o.id).set(clone(o));}));}}
}
async function delMany(coll,ids){
  if(!ids.length)return;
  var set=new Set(ids);
  S[coll]=S[coll].filter(function(x){return !set.has(x.id);});
  if(!DB)persistLocal();
  render();
  if(DB){for(var i=0;i<ids.length;i+=6){await Promise.all(ids.slice(i,i+6).map(function(id){return DB.collection(coll).doc(id).delete();}));}}
}
async function deleteCliente(id){
  var a=S.attivita.filter(function(x){return x.clienteId===id;}).map(function(x){return x.id;});
  var t=S.todo.filter(function(x){return x.clienteId===id;}).map(function(x){return x.id;});
  try{await delMany('attivita',a);await delMany('todo',t);await delMany('clienti',[id]);}catch(e){console.error(e);toast('Eliminazione non riuscita');}
}

/* ---------- collegamento a Supabase ---------- */
function tname(k){return 'crm_'+k;}
var DBA={collection:function(k){return {doc:function(id){return {
  set:async function(o){
    var r=await sb.from(tname(k)).upsert({user_id:USER.id,id:id,data:o,updated_at:new Date().toISOString()},{onConflict:'user_id,id'});
    if(r.error)throw r.error;
  },
  delete:async function(){
    var r=await sb.from(tname(k)).delete().eq('id',id);
    if(r.error)throw r.error;
  }
};}};}};
async function fetchAll(k){
  var out=[],from=0,step=1000;
  for(;;){
    var r=await sb.from(tname(k)).select('id,data').order('id').range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data.map(function(x){return Object.assign({id:x.id},x.data);}));
    if(r.data.length<step)break;
    from+=step;
  }
  return out;
}
async function reloadAll(){
  try{for(var i=0;i<COLL.length;i++){S[COLL[i]]=await fetchAll(COLL[i]);}render();}catch(e){console.error(e);}
}
function applyChange(k,p){
  if(p.eventType==='DELETE'){var id=p.old&&p.old.id;if(id)S[k]=S[k].filter(function(x){return x.id!==id;});}
  else if(p.new){upsertState(k,Object.assign({id:p.new.id},p.new.data));}
  render();
}
function subscribeRealtime(){
  if(CHANNEL)return;
  CHANNEL=sb.channel('crm-'+USER.id);
  COLL.forEach(function(k){CHANNEL.on('postgres_changes',{event:'*',schema:'public',table:tname(k)},function(p){applyChange(k,p);});});
  CHANNEL.subscribe();
}
async function startSession(user){
  if(USER&&USER.id===user.id&&S.mode==='db')return;
  USER=user;DB=DBA;S.mode='loading';render();
  try{
    for(var i=0;i<COLL.length;i++){S[COLL[i]]=await fetchAll(COLL[i]);S.ready[COLL[i]]=true;}
    S.mode='db';subscribeRealtime();
  }catch(e){console.error(e);S.mode='error';S.errMsg=(e&&e.message)||'';}
  render();
}
function endSession(){
  if(CHANNEL&&sb){try{sb.removeChannel(CHANNEL);}catch(e){}}
  CHANNEL=null;USER=null;DB=null;
  COLL.forEach(function(k){S[k]=[];S.ready[k]=false;});
  S.ui.tab='oggi';S.ui.clienteId=null;
  S.mode='auth';closeSheet();render();
}
function traduci(err){
  var m=(err&&err.message)||String(err||'');
  if(/Invalid login credentials/i.test(m))return 'Email o password non corrette.';
  if(/Email not confirmed/i.test(m))return 'Devi prima confermare l\'email: controlla la posta.';
  if(/already registered/i.test(m))return 'Esiste già un account con questa email. Prova ad accedere.';
  if(/at least \d+ characters/i.test(m))return 'La password è troppo corta (minimo 6 caratteri, meglio 8 o più).';
  if(/rate limit|too many/i.test(m))return 'Troppi tentativi ravvicinati. Aspetta un minuto e riprova.';
  if(/network|fetch/i.test(m))return 'Nessuna connessione. Riprova tra poco.';
  return m||'Operazione non riuscita.';
}

async function doSignIn(){
  var em=($('#a-email').value||'').trim(),pw=$('#a-pw').value||'';
  if(!em||!pw){authMsg('Inserisci email e password.',true);return;}
  authMsg('Accesso in corso…');
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){authMsg(traduci(r.error),true);return;}
  if(r.data&&r.data.user)await startSession(r.data.user);
}
async function doSignUp(){
  var em=($('#a-email').value||'').trim(),pw=$('#a-pw').value||'';
  if(!em||!pw){authMsg('Scrivi email e scegli una password.',true);return;}
  if(pw.length<8){authMsg('Scegli una password di almeno 8 caratteri.',true);return;}
  authMsg('Creo l\'account…');
  var r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
  if(r.error){authMsg(traduci(r.error),true);return;}
  if(r.data&&r.data.session){await startSession(r.data.user);return;}
  authMsg('Account creato. Ti abbiamo scritto: conferma l\'email, poi torna qui e accedi.');
}
async function doForgot(){
  var em=($('#a-email').value||'').trim();
  if(!em){authMsg('Scrivi la tua email, poi tocca di nuovo "Password dimenticata?".',true);return;}
  var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(r.error){authMsg(traduci(r.error),true);return;}
  authMsg('Se l\'email è registrata, riceverai un link per scegliere una nuova password.');
}
function openNewPassword(){
  openSheet('Nuova password','<form id="frm" novalidate><div class="field"><label class="lbl" for="np">Scegli la nuova password</label><input id="np" type="password" autocomplete="new-password"></div><div class="err" id="np-err" hidden></div><div class="actions"><button type="button" class="btn ghost" data-act="close">Annulla</button><button type="submit" class="btn primary">Salva</button></div></form>',function(sheet){

      var r=await sb.auth.updateUser({password:pw});

  });

async function init(){
  var cfg=window.CRM_CONFIG||{};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_KEY){S.mode='setup';render();return;}
  if(!window.supabase||!window.supabase.createClient){S.mode='error';S.errMsg='Il servizio dati non si è caricato. Controlla la connessione.';render();return;}
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
  S.mode='loading';renderNav();render();
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='SIGNED_OUT'){endSession();}
    else if(ev==='PASSWORD_RECOVERY'){setTimeout(openNewPassword,600);}
  });
  var r=await sb.auth.getSession();
  if(r.data&&r.data.session)await startSession(r.data.session.user);
  else{S.mode='auth';render();}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&USER&&S.mode==='db')reloadAll();});
}

function filtered(){
  var q=normKey(S.ui.q),qd=S.ui.q.replace(/\D/g,'');
  return S.clienti.filter(function(c){
    if(S.ui.filtro!=='tutti'&&c.stato!==S.ui.filtro)return false;

    var hay=[c.nome,c.citta,c.email,c.email2].concat((c.referenti||[]).map(function(r){return r.nome;})).map(normKey).join(' ');
    if(hay.indexOf(q)>=0)return true;
    if(qd.length>=3){var nums=[c.telefono,c.telefono2,c.fax].concat((c.referenti||[]).map(function(r){return (r.telefono||'')+' '+(r.cellulare||'');})).join(' ').replace(/\D/g,'');return nums.indexOf(qd)>=0;}

function doRender(){

function pickerHtml(cid,locked){

function wirePicker(sheet,onPick){
  var q=$('#pk-q',sheet),hid=$('#pk-id',sheet);
  if(!q){if(onPick)onPick(hid.value);return;}
  var res=$('#pk-res',sheet);
  function show(){
    var s=normKey(q.value),list=S.clienti.filter(function(c){return !s||normKey(c.nome).indexOf(s)>=0;}).sort(cmpNome).slice(0,6);
    res.innerHTML=list.map(function(c){return '<button type="button" class="pk-i" data-pick="'+esc(c.id)+'"><span>'+esc(c.nome)+'</span><small>'+esc(c.citta||'')+'</small></button>';}).join('')||'<div class="pk-none">Nessun risultato</div>';
    res.hidden=false;
  }
  q.addEventListener('input',function(){hid.value='';if(onPick)onPick('');show();});
  q.addEventListener('focus',show);
  res.addEventListener('click',function(e){
    var b=e.target.closest('[data-pick]');if(!b)return;
    var c=S.clienti.find(function(x){return x.id===b.dataset.pick;});if(!c)return;
    hid.value=c.id;q.value=c.nome;res.hidden=true;$('#pk-err',sheet).hidden=true;if(onPick)onPick(c.id);
  });
  sheet.addEventListener('click',function(e){if(!e.target.closest('#pk'))res.hidden=true;});
}

function readSheet(ws,alias){
  var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),h=-1,map=null;
  for(var i=0;i<Math.min(5,aoa.length);i++){
    var m={},hits=0;
    aoa[i].forEach(function(cell,ci){var k=normKey(cell);if(!k)return;for(var f in alias){if(!(f in m)&&alias[f].indexOf(k)>=0){m[f]=ci;hits++;break;}}});
    if(hits>=2||(hits>=1&&i===0)){h=i;map=m;break;}
  }
  if(h<0)return [];
  var out=[];
  for(var r=h+1;r<aoa.length;r++){
    var o={},any=false;
    for(var f in map){var v=aoa[r][map[f]];o[f]=v;if(v!==''&&v!=null)any=true;}
    if(any)out.push(o);
  }
  return out;
}
function parseWorkbook(wb){
  var out={clienti:[],referenti:[],attivita:[],todo:[],ignorati:[]},one=wb.SheetNames.length===1;
  wb.SheetNames.forEach(function(name){
    var n=normKey(name),kind=null;
    if(/referent|contatt/.test(n))kind='referenti';
    else if(/attivit|report|visit/.test(n))kind='attivita';
    else if(/to do|todo|promemoria|azioni/.test(n))kind='todo';
    else if(/client|aziend|rubrica/.test(n))kind='clienti';
    else if(one)kind='clienti';
    if(!kind){out.ignorati.push(name);return;}
    out[kind]=out[kind].concat(readSheet(wb.Sheets[name],ALIAS[kind]));
  });
  return out;
}
function parseDT(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return {d:dstr(v),t:(v.getHours()||v.getMinutes())?pad(v.getHours())+':'+pad(v.getMinutes()):''};
  if(typeof v==='number'&&v>59&&window.XLSX){var o=XLSX.SSF.parse_date_code(v);if(o)return {d:o.y+'-'+pad(o.m)+'-'+pad(o.d),t:(o.H||o.M)?pad(o.H)+':'+pad(o.M):''};}
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))){
    var y=+m[3];if(y<100)y+=2000;if(+m[2]>12||+m[1]>31)return null;
    return {d:y+'-'+pad(+m[2])+'-'+pad(+m[1]),t:m[4]!=null?pad(+m[4])+':'+m[5]:''};
  }
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2}))?/))){
    if(+m[2]>12||+m[3]>31)return null;
    return {d:m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]),t:m[4]!=null?pad(+m[4])+':'+m[5]:''};
  }
  return null;
}
function parseStato(v){var s=normKey(v);if(!s)return '';if(/^da |da appro|potenzial|prospect|lead|nuovo/.test(s))return 'da_approcciare';if(/appro|contattat|trattativa/.test(s))return 'approcciato';if(/client|acquisit|attivo/.test(s))return 'cliente';return '';}
function parseTipo(v){var s=normKey(v);if(/visit|sopralluog/.test(s))return 'visita';if(/telef|chiam/.test(s))return 'telefonata';if(/mail|posta/.test(s))return 'email';if(/riunion|meeting|incontro/.test(s))return 'riunione';return 'altro';}

    var k=normKey(name);if(!k)return null;
    var c=byName.get(k);
    if(!c){c={id:uid('c_'),nome:String(name).trim(),stato:'da_approcciare',referenti:[],creato:new Date().toISOString()};byName.set(k,c);work.set(c.id,c);created.add(c.id);return c;}
    if(!work.has(c.id)){c=clone(c);byName.set(k,c);work.set(c.id,c);}
    return work.get(c.id);
  }
  p.clienti.forEach(function(r){
    var c=getC(str(r.nome));if(!c){skipped++;return;}
    ['indirizzo','cap','citta','prov','telefono','telefono2','fax','email','email2','sito','piva','note'].forEach(function(f){var v=str(r[f]);if(v)c[f]=v;});
    var st=parseStato(r.stato);if(st)c.stato=st;
    if(!created.has(c.id))touched.add(c.id);
  });
  p.referenti.forEach(function(r){
    var c=getC(str(r.azienda)),nome=str(r.nome);if(!c||!nome){skipped++;return;}
    c.referenti=c.referenti||[];
    var ref=c.referenti.find(function(x){return normKey(x.nome)===normKey(nome);});
    if(!ref){ref={id:uid('r_'),nome:nome};c.referenti.push(ref);nRef++;}
    ['ruolo','telefono','cellulare','email','note'].forEach(function(f){var v=str(r[f]);if(v)ref[f]=v;});
  });
  var aKey=function(a){return [a.clienteId,a.data,a.tipo,normKey(a.titolo)].join('|');},exA=new Set(S.attivita.map(aKey)),newActs=[];
  p.attivita.forEach(function(r){
    var c=getC(str(r.azienda));if(!c){skipped++;return;}
    var dt=parseDT(r.data);
    var a={id:uid('a_'),clienteId:c.id,tipo:parseTipo(r.tipo),data:dt?dt.d+'T'+(dt.t||'09:00'):nowLocal(),titolo:str(r.titolo),note:str(r.note),referenteId:'',creato:new Date().toISOString()};
    if(exA.has(aKey(a)))return;exA.add(aKey(a));newActs.push(a);
  });
  var tKey=function(a){return [a.clienteId,normKey(a.titolo),a.scadenza].join('|');},exT=new Set(S.todo.map(tKey)),newTodos=[];
  p.todo.forEach(function(r){
    var c=getC(str(r.azienda)),tit=str(r.titolo);if(!c||!tit){skipped++;return;}
    var sc=parseDT(r.scadenza),pr=parseDT(r.promemoria),fatto=/^(s[iì]|si|x|1|true|fatto|completato|yes)$/i.test(str(r.fatto));
    var t={id:uid('t_'),clienteId:c.id,titolo:tit,scadenza:sc?sc.d:'',promemoria:pr?pr.d+'T'+(pr.t||'09:00'):'',priorita:/alt/i.test(str(r.priorita))?'alta':'normale',fatto:fatto,fattoIl:fatto?new Date().toISOString():'',note:str(r.note),creato:new Date().toISOString()};
    if(exT.has(tKey(t)))return;exT.add(tKey(t));newTodos.push(t);
  });
  return {work:work,created:created,touched:touched,nRef:nRef,newActs:newActs,newTodos:newTodos,skipped:skipped};
}
function handleFile(file){
  if(!file)return;
  if(!window.XLSX){toast('La libreria Excel non si è caricata. Ricarica la pagina.');return;}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var wb=XLSX.read(fr.result,{type:'array'}),parsed=parseWorkbook(wb),plan=planImport(parsed);
      var total=plan.work.size+plan.newActs.length+plan.newTodos.length;
      if(!total){openSheet('Importa da Excel','<p>Non ho trovato colonne riconoscibili nel file. Scarica il modello Excel e usa quei fogli e quelle intestazioni.</p><div class="actions"><button class="btn ghost" data-act="template">Scarica il modello</button><button class="btn primary" data-act="close">Chiudi</button></div>');return;}
      PENDING=plan;
      openSheet('Importa da Excel','<p class="muted">File: '+esc(file.name)+'</p><div class="sum"><div><span>Clienti nuovi</span><b>'+plan.created.size+'</b></div><div><span>Clienti aggiornati</span><b>'+plan.touched.size+'</b></div><div><span>Referenti nuovi</span><b>'+plan.nRef+'</b></div><div><span>Attività nuove</span><b>'+plan.newActs.length+'</b></div><div><span>To-do nuovi</span><b>'+plan.newTodos.length+'</b></div></div>'
        +(parsed.ignorati.length?'<p class="hint">Fogli ignorati: '+esc(parsed.ignorati.join(', '))+'.</p>':'')+(plan.skipped?'<p class="hint">Righe saltate perché senza nome azienda o titolo: '+plan.skipped+'.</p>':'')
        +'<div class="actions"><button class="btn ghost" data-act="close">Annulla</button><button class="btn primary" data-act="do-import">Importa</button></div>');
    }catch(e){console.error(e);toast('Non riesco a leggere questo file');}
  };
  fr.onerror=function(){toast('Non riesco a leggere questo file');};
  fr.readAsArrayBuffer(file);
}
async function doImport(){
  var p=PENDING;if(!p)return;PENDING=null;
  var btn=$('[data-act="do-import"]');if(btn){btn.disabled=true;btn.textContent='Importo…';}
  try{
    await putMany('clienti',Array.from(p.work.values()));await putMany('attivita',p.newActs);await putMany('todo',p.newTodos);
    closeSheet();toast('Importazione completata');S.ui.tab='clienti';S.ui.clienteId=null;render();window.scrollTo(0,0);
  }catch(e){console.error(e);closeSheet();toast('Importazione interrotta: alcuni dati potrebbero mancare');}
}

/* ---------- eventi ---------- */
var H={
  tab:function(el){S.ui.tab=el.dataset.v;S.ui.clienteId=null;window.scrollTo(0,0);render();},
  back:function(){S.ui.clienteId=null;render();},
  fab:function(){openQuick();},
  close:function(){closeSheet();},
  dati:function(){openDati();},
  'open-cliente':function(el){S.ui.tab='clienti';S.ui.clienteId=el.dataset.id;S.ui.sub='scheda';window.scrollTo(0,0);render();},
  'goto-cliente':function(el){closeSheet();S.ui.tab='clienti';S.ui.clienteId=el.dataset.id;S.ui.sub='scheda';window.scrollTo(0,0);render();},
  'goto-stato':function(el){S.ui.tab='clienti';S.ui.clienteId=null;S.ui.filtro=el.dataset.v;S.ui.q='';window.scrollTo(0,0);render();},
  filtro:function(el){S.ui.filtro=el.dataset.v;updateClientiList();},
  todof:function(el){S.ui.todoF=el.dataset.v;render();},
  attf:function(el){S.ui.attF=el.dataset.v;render();},
  sub:function(el){S.ui.sub=el.dataset.v;render();},
  'set-stato':function(el){var c=S.clienti.find(function(x){return x.id===S.ui.clienteId;});if(!c||c.stato===el.dataset.v)return;var o=clone(c);o.stato=el.dataset.v;o.aggiornato=new Date().toISOString();put('clienti',o);},
  'edit-cliente':function(el){openClienteForm(el.dataset.id);},
  'new-ref':function(){openRefForm(S.ui.clienteId);},
  'edit-ref':function(el){openRefForm(S.ui.clienteId,el.dataset.id);},
  'new-att':function(el){openAttForm({clienteId:el.dataset.cid});},
  'edit-att':function(el){openAttForm({id:el.dataset.id});},
  'new-todo':function(el){openTodoForm({clienteId:el.dataset.cid});},
  'edit-todo':function(el){openTodoForm({id:el.dataset.id});},
  'q-visita':function(el){openAttForm({clienteId:el.dataset.cid,tipo:'visita'});},
  'q-tel':function(el){openAttForm({clienteId:el.dataset.cid,tipo:'telefonata'});},
  'q-todo':function(el){openTodoForm({clienteId:el.dataset.cid});},
  'q-cliente':function(){openClienteForm();},
  'toggle-todo':function(el){var td=S.todo.find(function(x){return x.id===el.dataset.id;});if(!td)return;var o=clone(td);o.fatto=!o.fatto;o.fattoIl=o.fatto?new Date().toISOString():'';put('todo',o);},
  copy:function(el){copyText(el.dataset.v);},
  'date-set':function(el){var i=$('#'+el.dataset.t);if(i)i.value=addDays(todayStr(),+el.dataset.n);},
  'rem-9':function(){var s=$('#f-scad').value;if(!s){toast('Imposta prima la scadenza');return;}$('#f-prom').value=s+'T09:00';},
  'rem-clear':function(){$('#f-prom').value='';},
  del:function(el){
    if(!el.classList.contains('armed')){
      el.classList.add('armed');el.dataset.orig=el.textContent;el.textContent='Tocca per confermare';
      setTimeout(function(){if(el.isConnected){el.classList.remove('armed');el.textContent=el.dataset.orig;}},4000);return;
    }
    var k=el.dataset.kind,id=el.dataset.id;
    if(k==='cliente'){closeSheet();S.ui.clienteId=null;deleteCliente(id).then(function(){toast('Cliente eliminato');});}
    else if(k==='att'){closeSheet();delMany('attivita',[id]).then(function(){toast('Attività eliminata');});}
    else if(k==='todo'){closeSheet();delMany('todo',[id]).then(function(){toast('To-do eliminato');});}
    else if(k==='ref'){var c=S.clienti.find(function(x){return x.id===S.ui.clienteId;});if(c){var o=clone(c);o.referenti=(o.referenti||[]).filter(function(r){return r.id!==id;});closeSheet();put('clienti',o);toast('Referente eliminato');}}
  },
  'load-esempi':function(){loadEsempi();},
  'rm-esempi':function(){removeEsempi();},
  import:function(){var f=$('#file');f.value='';f.click();},
  export:function(){doExport(false);},
  template:function(){doExport(true);},
  'do-import':function(){doImport();},
  signup:function(){doSignUp();},
  forgot:function(){doForgot();},
  retry:function(){location.reload();},
  logout:async function(){closeSheet();try{await sb.auth.signOut();}catch(e){console.error(e);}endSession();}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=H[el.dataset.act];if(f){f(el,e);}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){S.ui.q=e.target.value;updateClientiList();}
});
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='auth-form'){e.preventDefault();doSignIn();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#scrim'))closeSheet();});
$('#file').addEventListener('change',function(e){handleFile(e.target.files&&e.target.files[0]);});

init();
})();
